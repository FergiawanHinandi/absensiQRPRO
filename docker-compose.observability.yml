version: '3.8'

# ==============================================================================
# AbsensiQRPro - Production Observability Stack
# ==============================================================================
# Usage:
#   docker-compose -f docker-compose.observability.yml up -d
#
# Dependencies:
#   - Requires a shared Docker network "absensi_network"
#   - Redis service must be named "redis" on the same network for redis-exporter
#   - PostgreSQL service must be named "postgres" on the same network for pg-exporter
#   - Application logs must be accessible at ./backend/storage/logs/
#
# Secrets (.env file):
#   GF_ADMIN_PASSWORD=secure_password_here
#   PG_EXPORTER_DSN=postgresql://user:password@postgres:5432/absensi?sslmode=disable
# ==============================================================================

services:
  # ---------------------------------------------------------------------------
  # Layer 0: Alertmanager (Alert Routing)
  # ---------------------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:latest
    container_name: absensi_alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./infrastructure/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    networks:
      - absensi_network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Layer 1: Metrics (Prometheus + Grafana)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: absensi_prometheus
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/prometheus/alerts.yml:/etc/prometheus/rules/absensi_alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    depends_on:
      - alertmanager
    networks:
      - absensi_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: absensi_grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/etc/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_AUTH_ANONYMOUS_ENABLED=false
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - absensi_network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Layer 2: Logs (Loki + Promtail)
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:latest
    container_name: absensi_loki
    volumes:
      - ./infrastructure/loki/config/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - ./infrastructure/loki/rules:/etc/loki/rules:ro
      - loki_data:/tmp/loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yaml
    networks:
      - absensi_network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: absensi_promtail
    volumes:
      - ./infrastructure/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/log:/var/log:ro
      # Ensure logs are accessible by running from project root:
      - ./backend/storage/logs:/var/www/storage/logs:ro
    command: -config.file=/etc/promtail/promtail-config.yaml
    depends_on:
      - loki
    networks:
      - absensi_network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Layer 3: Distributed Tracing (Jaeger)
  # ---------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: absensi_jaeger
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Web UI
      - "4317:4317"   # OTLP gRPC Receiver
      - "4318:4318"   # OTLP HTTP Receiver
      - "9411:9411"   # Zipkin fallback
    networks:
      - absensi_network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Layer 4: OpenTelemetry Collector (Central Nervous System)
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: absensi_otel_collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infrastructure/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "8888:8888"   # Prometheus metrics exposed by the collector
      - "8889:8889"   # Prometheus exporter metrics
      - "13133:13133" # health_check extension
    depends_on:
      - jaeger
      - prometheus
    networks:
      - absensi_network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Exporters (Database, Redis)
  # ---------------------------------------------------------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: absensi_pg_exporter
    environment:
      DATA_SOURCE_NAME: ${PG_EXPORTER_DSN:-postgresql://absensi:password@postgres:5432/absensi?sslmode=disable}
    ports:
      - "9187:9187"
    networks:
      - absensi_network
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: absensi_redis_exporter
    environment:
      REDIS_ADDR: "${REDIS_ADDR:-redis:6379}"
    ports:
      - "9121:9121"
    networks:
      - absensi_network
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  alertmanager_data:

networks:
  absensi_network:
    external: true
    name: absensi_network
