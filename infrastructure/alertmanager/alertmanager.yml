# Alertmanager Configuration for AbsensiQRPro
# ==============================================================================
# Configure your notification receivers below to route alerts.
# Supported receivers: slack, email, pagerduty, webhook, opsgenie, etc.
# ==============================================================================

global:
  # The SMTP host for email notifications
  # smtp_smarthost: 'smtp.gmail.com:587'
  # smtp_from: 'alerts@absensiqr.com'
  # smtp_auth_username: 'your-email@gmail.com'
  # smtp_auth_password: 'your-app-password'
  resolve_timeout: 5m

route:
  receiver: 'default'
  group_by: ['alertname', 'severity', 'team']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # Critical alerts: page on-call immediately
    - match:
        severity: critical
      receiver: 'default'
      repeat_interval: 10m

    # Warning alerts: less frequent repeats
    - match:
        severity: warning
      receiver: 'default'
      repeat_interval: 1h

receivers:
  # ============================================================================
  # Default receiver - outputs to stdout (visible in docker logs)
  # ============================================================================
  - name: 'default'
    webhook_configs:
      # ⚠️ Placeholder — replace with a real receiver (Slack/email/PagerDuty).
      # Alerts are currently visible in Alertmanager UI (port 9093) but NOT delivered.
      # See examples below for Slack, Email, and PagerDuty configuration.

