# Logstash Pipeline Configuration for AbsensiQRPro
# Place in /etc/logstash/conf.d/absensi.conf

input {
  # TCP input from Laravel applications
  tcp {
    port => 5044
    codec => json_lines
    tags => ["absensi", "laravel"]
  }
  
  # UDP input (alternative)
  udp {
    port => 5044
    codec => json_lines
    tags => ["absensi", "laravel"]
  }

  # Beats input for Filebeat log shipping
  beats {
    port => 5045
    tags => ["absensi", "filebeat"]
  }
}

filter {
  # Parse @timestamp if string
  if [@timestamp] {
    date {
      match => ["@timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }

  # Extract fields for better indexing
  if [request_id] {
    mutate {
      add_field => { "[labels][request_id]" => "%{request_id}" }
    }
  }

  if [user_id] {
    mutate {
      add_field => { "[labels][user_id]" => "%{user_id}" }
    }
  }

  if [school_id] {
    mutate {
      add_field => { "[labels][school_id]" => "%{school_id}" }
    }
  }

  if [endpoint] {
    mutate {
      add_field => { "[labels][endpoint]" => "%{endpoint}" }
    }
  }

  # Parse event type for routing
  if [context][event_type] {
    mutate {
      add_field => { "event_category" => "%{[context][event_type]}" }
    }
    
    # Split event type for categorization
    ruby {
      code => '
        event_type = event.get("event_category")
        if event_type
          parts = event_type.split(".")
          event.set("event_domain", parts[0]) if parts[0]
          event.set("event_action", parts[1]) if parts[1]
          event.set("event_result", parts[2]) if parts[2]
        end
      '
    }
  }

  # Geoip lookup for request IPs
  if [request][ip] and [request][ip] !~ /^(127\.|10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[0-1])\.)/ {
    geoip {
      source => "[request][ip]"
      target => "[geoip]"
      add_tag => ["geoip"]
    }
  }

  # Calculate response time buckets for dashboards
  if [response_time_ms] {
    ruby {
      code => '
        time = event.get("response_time_ms").to_f
        bucket = case time
          when 0..100 then "fast"
          when 100..500 then "normal"
          when 500..1000 then "slow"
          else "very_slow"
        end
        event.set("response_time_bucket", bucket)
      '
    }
  }

  # Tag security events for alerts
  if [channel] == "security" {
    mutate {
      add_tag => ["security_event"]
    }
  }

  # Tag errors for alerting
  if [level] in ["ERROR", "CRITICAL", "ALERT", "EMERGENCY"] {
    mutate {
      add_tag => ["error", "alert_candidate"]
    }
  }

  # Remove sensitive data
  mutate {
    remove_field => ["password", "token", "secret", "api_key", "[context][password]"]
  }
}

output {
  # Main Elasticsearch output with ILM
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOSTS:elasticsearch:9200}"]
    user => "${ELASTICSEARCH_USER:elastic}"
    password => "${ELASTICSEARCH_PASSWORD}"
    ssl_enabled => "${ELASTICSEARCH_SSL:false}"
    
    # Use data streams for better ILM support
    data_stream => true
    data_stream_type => "logs"
    data_stream_dataset => "absensi"
    data_stream_namespace => "${ENVIRONMENT:production}"
    
    # Alternative: Index-based routing by channel
    # index => "absensi-%{channel}-%{+YYYY.MM.dd}"
  }

  # Output security events to separate index
  if "security_event" in [tags] {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_HOSTS:elasticsearch:9200}"]
      user => "${ELASTICSEARCH_USER:elastic}"
      password => "${ELASTICSEARCH_PASSWORD}"
      index => "absensi-security-%{+YYYY.MM.dd}"
    }
  }

  # Debug output (comment out in production)
  # stdout {
  #   codec => rubydebug
  # }
}
