# Promtail Configuration for Grafana Loki
# Scrapes Laravel JSON logs and ships to Loki

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: ${LOKI_URL:-http://loki:3100}/loki/api/v1/push
    tenant_id: ${LOKI_TENANT_ID:-absensi}
    batchwait: 1s
    batchsize: 1048576
    timeout: 10s
    external_labels:
      environment: ${ENVIRONMENT:-production}
      cluster: ${CLUSTER_NAME:-default}

scrape_configs:
  # Scrape Laravel log files
  - job_name: laravel-logs
    static_configs:
      - targets:
          - localhost
        labels:
          app: absensi
          service: api
          __path__: /var/log/absensi/*.log

    pipeline_stages:
      # Parse JSON logs
      - json:
          expressions:
            timestamp: '@timestamp'
            level: level
            message: message
            channel: channel
            request_id: request_id
            user_id: user_id
            school_id: school_id
            endpoint: endpoint
            response_time_ms: response_time_ms
            ip: ip
            event_type: 'context.event_type'

      # Set timestamp from log
      - timestamp:
          source: timestamp
          format: RFC3339
          fallback_formats:
            - '2006-01-02T15:04:05.999999Z07:00'

      # Extract labels for filtering
      - labels:
          level:
          channel:
          endpoint:
          school_id:

      # Add static labels based on content
      - match:
          selector: '{channel="security"}'
          stages:
            - labels:
                alert_type: security

      - match:
          selector: '{level=~"ERROR|CRITICAL|ALERT|EMERGENCY"}'
          stages:
            - labels:
                severity: error

      # Drop debug logs in production (optional)
      # - match:
      #     selector: '{level="DEBUG"}'
      #     action: drop

  # Scrape container stdout (for Docker/K8s)
  - job_name: container-logs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["app=absensi"]

    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_app']
        target_label: 'app'
      - source_labels: ['__meta_docker_container_label_service']
        target_label: 'service'

    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            channel: channel
            request_id: request_id
      - labels:
          level:
          channel:

  # Scrape Kubernetes pods
  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - absensi
            - default

    relabel_configs:
      # Only scrape pods with app=absensi label
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: absensi

      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_container_name]
        target_label: container

    pipeline_stages:
      - cri: {}
      - json:
          expressions:
            level: level
            message: message
            channel: channel
            request_id: request_id
            user_id: user_id
            school_id: school_id
      - labels:
          level:
          channel:
