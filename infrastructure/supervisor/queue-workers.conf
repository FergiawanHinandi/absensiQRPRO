;##############################################################################
; Supervisor Configuration for Laravel Queue Workers
; Auto-scaling managed by QueueWorkerScalerService
;##############################################################################

[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --memory=128
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
; Number of workers - managed by queue:scale command
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=60
; Graceful restart
stopsignal=TERM

;##############################################################################
; High Priority Queue Workers
;##############################################################################

[program:laravel-worker-high]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work redis --queue=high --sleep=1 --tries=3 --max-time=3600 --memory=128
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker-high.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=60
stopsignal=TERM

;##############################################################################
; Notifications Queue Workers
;##############################################################################

[program:laravel-worker-notifications]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work redis --queue=notifications --sleep=3 --tries=3 --max-time=3600 --memory=64
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker-notifications.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
stopwaitsecs=60
stopsignal=TERM

;##############################################################################
; Queue Scaler Daemon (monitors and adjusts numprocs)
;##############################################################################

[program:queue-scaler]
process_name=%(program_name)s
command=php /var/www/html/artisan queue:scale --daemon --interval=60
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/queue-scaler.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
stopwaitsecs=30
stopsignal=TERM

;##############################################################################
; Group for easy management
;##############################################################################

[group:laravel-workers]
programs=laravel-worker,laravel-worker-high,laravel-worker-notifications,queue-scaler
priority=999
