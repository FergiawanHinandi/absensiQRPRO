##############################################################################
# Prometheus Configuration for AbsensiQRPro
# Save as: /etc/prometheus/prometheus.yml
##############################################################################

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'production'
    env: 'prod'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Rule files
rule_files:
  - /etc/prometheus/rules/*.yml

# Scrape configurations
scrape_configs:
  ##########################################################################
  # Prometheus self-monitoring
  ##########################################################################
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  ##########################################################################
  # AbsensiQRPro Laravel API
  ##########################################################################
  - job_name: 'absensi-api'
    metrics_path: /metrics
    scheme: https
    
    # Bearer token authentication
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics_token
    
    # Service discovery for Kubernetes
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - production
    
    relabel_configs:
      # Only scrape pods with annotation
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      
      # Use custom port if specified
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        target_label: __address__
        regex: (.+)
        replacement: ${1}
      
      # Add pod labels
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace

    # Static config fallback (for non-K8s deployments)
    static_configs:
      - targets:
          - 'api-1.internal:9000'
          - 'api-2.internal:9000'
        labels:
          app: 'absensi-api'
          environment: 'production'

  ##########################################################################
  # PostgreSQL Exporter
  ##########################################################################
  - job_name: 'postgres'
    static_configs:
      - targets:
          - 'postgres-exporter:9187'
        labels:
          database: 'absensi'

  ##########################################################################
  # Redis Exporter
  ##########################################################################
  - job_name: 'redis'
    static_configs:
      - targets:
          - 'redis-exporter:9121'
        labels:
          service: 'redis'

  ##########################################################################
  # Node Exporter (System Metrics)
  ##########################################################################
  - job_name: 'node'
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node

  ##########################################################################
  # Nginx Exporter
  ##########################################################################
  - job_name: 'nginx'
    static_configs:
      - targets:
          - 'nginx-exporter:9113'

  ##########################################################################
  # Queue Workers (Supervisor)
  ##########################################################################
  - job_name: 'queue-workers'
    static_configs:
      - targets:
          - 'worker-1.internal:9000'
          - 'worker-2.internal:9000'
        labels:
          app: 'absensi-worker'
