name: absensi_qr_mobile
description: Offline-first QR Attendance Mobile App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Networking
  dio: ^5.4.0
  connectivity_plus: ^5.0.2

  # QR Scanning
  mobile_scanner: ^4.0.1

  # Location
  geolocator: ^11.0.0
  permission_handler: ^11.3.0

  # Device Info
  device_info_plus: ^10.1.0

  # Secure Storage
  flutter_secure_storage: ^9.0.0

  # Utils
  uuid: ^4.3.3
  intl: ^0.19.0

  # Dependency Injection
  get_it: ^7.6.7

  # Logging
  logger: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

  # Code Generation
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

  # Testing
  mocktail: ^1.0.3
  bloc_test: ^9.1.6

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
