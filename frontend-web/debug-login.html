<!DOCTYPE html>
<html>
<head>
    <title>Debug Login Test</title>
</head>
<body>
    <h1>Debug Login Test</h1>
    <button onclick="testLogin()">Test Login</button>
    <div id="result"></div>

    <script>
        async function testLogin() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing login...';

            try {
                console.log('1. Starting login test...');
                
                const response = await fetch('http://localhost:8000/api/v1/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        username: 'superadmin',
                        password: 'password123'
                    })
                });

                console.log('2. Response status:', response.status);
                console.log('3. Response headers:', response.headers);

                const data = await response.json();
                console.log('4. Response data:', data);

                if (data.success) {
                    console.log('5. Login successful!');
                    console.log('6. Access token:', data.data.access_token?.substring(0, 20) + '...');
                    console.log('7. User role:', data.data.user.role_type);
                    
                    resultDiv.innerHTML = `
                        <h2>✅ Login Successful!</h2>
                        <p><strong>Token:</strong> ${data.data.access_token?.substring(0, 20)}...</p>
                        <p><strong>User:</strong> ${data.data.user.name}</p>
                        <p><strong>Role:</strong> ${data.data.user.role_type}</p>
                        <p><strong>Expected Redirect:</strong> /super-admin/dashboard</p>
                    `;
                } else {
                    console.log('5. Login failed:', data);
                    resultDiv.innerHTML = `<h2>❌ Login Failed</h2><pre>${JSON.stringify(data, null, 2)}</pre>`;
                }
            } catch (error) {
                console.error('Login error:', error);
                resultDiv.innerHTML = `<h2>❌ Error</h2><pre>${error.message}</pre>`;
            }
        }
    </script>
</body>
</html>
