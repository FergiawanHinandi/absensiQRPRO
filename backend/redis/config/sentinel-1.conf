# Redis Sentinel 1 Configuration
port 26379

# Sentinel monitoring
sentinel monitor mymaster redis-master 6379 2
sentinel auth-pass mymaster changeme

# Timing configuration
sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 30000
sentinel parallel-syncs mymaster 1

# Notification scripts (optional - configure paths as needed)
# sentinel notification-script mymaster /opt/redis/notify.sh
# sentinel client-reconfig-script mymaster /opt/redis/reconfig.sh

# Logging
loglevel notice
logfile ""

# Working directory
dir /data

# Sentinel configuration will be rewritten by Sentinel itself
# Do not edit lines below this point
