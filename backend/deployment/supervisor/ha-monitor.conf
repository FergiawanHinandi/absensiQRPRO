[program:ha-monitor]
process_name=%(program_name)s
command=php /var/www/absensiQRPro/backend/artisan ha:monitor --daemon --interval=30 --alert --auto-failover
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/absensi/ha-monitor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=30

; Environment variables
environment=HOME="/var/www/absensiQRPro/backend"

; Don't start too fast (prevent rapid restart loops)
startsecs=10
startretries=3
