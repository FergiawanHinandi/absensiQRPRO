# Supervisor Configuration for AbsensiQRPro Queue Workers
# 
# Installation:
#   1. Install supervisor: sudo apt-get install supervisor
#   2. Copy this file: sudo cp supervisor.conf /etc/supervisor/conf.d/absensi-worker.conf
#   3. Update paths below to match your deployment
#   4. Start supervisor: sudo supervisorctl reread && sudo supervisorctl update
#   5. Monitor: sudo supervisorctl status
#
# Commands:
#   sudo supervisorctl restart absensi-worker:*     - Restart all workers
#   sudo supervisorctl stop absensi-worker:*        - Stop all workers
#   sudo supervisorctl tail absensi-worker-01       - View logs
#
# For production, adjust numprocs based on server CPU cores (recommended: numprocs = CPU cores)

[program:absensi-worker]
process_name=%(program_name)s-%(process_num)02d
command=php /var/www/absensi/backend/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --memory=256
directory=/var/www/absensi/backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/www/absensi/backend/storage/logs/worker-%(process_num)02d.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=30
startsecs=5

# Environment variables (uncomment and adjust as needed)
# environment=
#     APP_ENV="production",
#     QUEUE_CONNECTION="database"

# ========================================
# HORIZON WORKER (if using Redis + Horizon)
# Uncomment this section if using Laravel Horizon
# ========================================

# [program:absensi-horizon]
# process_name=%(program_name)s
# command=php /var/www/absensi/backend/artisan horizon
# directory=/var/www/absensi/backend
# autostart=true
# autorestart=true
# stopasgroup=true
# killasgroup=true
# user=www-data
# numprocs=1
# redirect_stderr=true
# stdout_logfile=/var/www/absensi/backend/storage/logs/horizon.log
# stdout_logfile_maxbytes=10MB
# stdout_logfile_backups=5
# stopwaitsecs=30
# startsecs=5

# ========================================
# SCHEDULER (Cron alternative via Supervisor)
# Optional: Run Laravel scheduler via supervisor instead of cron
# ========================================

[program:absensi-scheduler]
process_name=%(program_name)s
command=/bin/bash -c "while [ true ]; do php /var/www/absensi/backend/artisan schedule:run --verbose --no-interaction; sleep 60; done"
directory=/var/www/absensi/backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/absensi/backend/storage/logs/scheduler.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
stopwaitsecs=10

# ========================================
# REVERB WEBSOCKET SERVER
# ========================================

[program:absensi-reverb]
process_name=%(program_name)s
command=php /var/www/absensi/backend/artisan reverb:start --host=0.0.0.0 --port=8080
directory=/var/www/absensi/backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/absensi/backend/storage/logs/reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=30
startsecs=5

# ========================================
# GROUP CONFIGURATION
# ========================================

[group:absensi]
programs=absensi-worker,absensi-scheduler,absensi-reverb
priority=999
