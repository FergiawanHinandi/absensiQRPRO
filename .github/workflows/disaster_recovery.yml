name: Disaster Recovery Test

on:
  schedule:
    # Weekly on Sunday at 3 AM UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      create_fresh_backup:
        description: 'Create fresh backup before testing'
        required: false
        default: 'true'
        type: boolean
      notify:
        description: 'Send notifications on completion'
        required: false
        default: 'true'
        type: boolean

env:
  PHP_VERSION: '8.2'
  BACKUP_DISK: 'local'

jobs:
  dr_test:
    name: Disaster Recovery Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    outputs:
      test_status: ${{ steps.run_dr_test.outputs.status }}
      test_report: ${{ steps.run_dr_test.outputs.report_path }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pgsql, zip, mbstring, xml, curl
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Dependencies
        working-directory: ./backend
        run: composer install --no-dev --prefer-dist --no-interaction

      - name: Run DR Test via SSH
        id: run_dr_test
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 25m
          script: |
            cd /var/www/absensiQRPro/backend
            
            echo "=== Starting Disaster Recovery Test Workflow ==="
            echo "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            
            # Run the DR test workflow
            CREATE_BACKUP="${{ github.event.inputs.create_fresh_backup || 'true' }}"
            NOTIFY="${{ github.event.inputs.notify || 'true' }}"
            
            DR_FLAGS="--disk=${{ env.BACKUP_DISK }} --save-report"
            
            if [ "$CREATE_BACKUP" = "true" ]; then
              DR_FLAGS="$DR_FLAGS --create-backup"
            fi
            
            if [ "$NOTIFY" = "true" ]; then
              DR_FLAGS="$DR_FLAGS --notify"
            fi
            
            # Execute DR test
            php artisan dr:test-workflow $DR_FLAGS --json > /tmp/dr_test_result.json 2>&1
            DR_EXIT_CODE=$?
            
            # Output results
            cat /tmp/dr_test_result.json
            
            # Parse status for GitHub output
            if [ $DR_EXIT_CODE -eq 0 ]; then
              echo "status=PASS" >> $GITHUB_OUTPUT
            else
              echo "status=FAIL" >> $GITHUB_OUTPUT
            fi
            
            exit $DR_EXIT_CODE

      - name: Upload DR Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dr-test-report-${{ github.run_number }}
          path: |
            /tmp/dr_test_result.json
          retention-days: 30

  notify_results:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: dr_test
    if: always()
    
    steps:
      - name: Determine notification status
        id: status
        run: |
          if [ "${{ needs.dr_test.outputs.test_status }}" = "PASS" ]; then
            echo "icon=✅" >> $GITHUB_OUTPUT
            echo "color=good" >> $GITHUB_OUTPUT
            echo "message=Disaster Recovery Test PASSED" >> $GITHUB_OUTPUT
          else
            echo "icon=❌" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
            echo "message=Disaster Recovery Test FAILED" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack Notification
        if: ${{ secrets.SLACK_DR_WEBHOOK != '' }}
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "attachments": [
                {
                  "color": "${{ steps.status.outputs.color }}",
                  "blocks": [
                    {
                      "type": "header",
                      "text": {
                        "type": "plain_text",
                        "text": "${{ steps.status.outputs.icon }} DR Test: ${{ needs.dr_test.outputs.test_status }}"
                      }
                    },
                    {
                      "type": "section",
                      "fields": [
                        {
                          "type": "mrkdwn",
                          "text": "*Repository:*\n${{ github.repository }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Run:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_number }}>"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Trigger:*\n${{ github.event_name }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Timestamp:*\n${{ github.event.head_commit.timestamp || github.run_started_at }}"
                        }
                      ]
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DR_WEBHOOK }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Create GitHub Issue on Failure
        if: failure() && needs.dr_test.outputs.test_status == 'FAIL'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 DR Test Failed - Run #${context.runNumber}`;
            const body = `
            ## Disaster Recovery Test Failed
            
            **Run:** [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            **Triggered by:** ${context.eventName}
            **Timestamp:** ${new Date().toISOString()}
            
            ### Action Required
            1. Review the [workflow logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            2. Check backup integrity manually
            3. Verify database connectivity
            4. Review integrity check failures
            
            ### Labels
            - \`critical\`
            - \`disaster-recovery\`
            - \`automated\`
            `;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['critical', 'disaster-recovery', 'automated']
            });

  weekly_report:
    name: Generate Weekly DR Report
    runs-on: ubuntu-latest
    needs: dr_test
    if: github.event_name == 'schedule'
    
    steps:
      - name: Download DR Report
        uses: actions/download-artifact@v4
        with:
          name: dr-test-report-${{ github.run_number }}
          path: ./reports

      - name: Generate Weekly Summary
        run: |
          echo "=== Weekly DR Test Summary ===" > weekly_summary.md
          echo "" >> weekly_summary.md
          echo "**Date:** $(date -u +"%Y-%m-%d")" >> weekly_summary.md
          echo "**Run Number:** ${{ github.run_number }}" >> weekly_summary.md
          echo "**Status:** ${{ needs.dr_test.outputs.test_status }}" >> weekly_summary.md
          echo "" >> weekly_summary.md
          
          if [ -f "./reports/dr_test_result.json" ]; then
            echo "### Test Details" >> weekly_summary.md
            echo '```json' >> weekly_summary.md
            cat ./reports/dr_test_result.json >> weekly_summary.md
            echo '```' >> weekly_summary.md
          fi
          
          cat weekly_summary.md

      - name: Upload Weekly Summary
        uses: actions/upload-artifact@v4
        with:
          name: weekly-dr-summary-${{ github.run_number }}
          path: weekly_summary.md
          retention-days: 90
