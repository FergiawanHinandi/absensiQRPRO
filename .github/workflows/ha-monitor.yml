name: High Availability Monitor

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      alert_on_warning:
        description: 'Send alerts on warning status'
        required: false
        default: 'false'
        type: boolean

env:
  PHP_VERSION: '8.2'

jobs:
  health_check:
    name: System Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    outputs:
      status: ${{ steps.health.outputs.status }}
      alerts: ${{ steps.health.outputs.alerts }}
    
    steps:
      - name: Run Health Check via SSH
        id: health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 2m
          script: |
            cd /var/www/absensiQRPro/backend
            
            # Run HA monitor
            RESULT=$(php artisan ha:monitor --json 2>&1)
            
            # Extract status
            STATUS=$(echo "$RESULT" | jq -r '.overall_status // "error"')
            ALERTS=$(echo "$RESULT" | jq -r '.alerts | length')
            
            echo "status=$STATUS" >> $GITHUB_OUTPUT
            echo "alerts=$ALERTS" >> $GITHUB_OUTPUT
            
            # Output full result for logging
            echo "$RESULT"
            
            # Exit with appropriate code
            case $STATUS in
              healthy) exit 0 ;;
              warning) exit 1 ;;
              critical) exit 2 ;;
              *) exit 3 ;;
            esac

  alert_on_failure:
    name: Send Alerts
    runs-on: ubuntu-latest
    needs: health_check
    if: failure() || needs.health_check.outputs.status == 'critical'
    
    steps:
      - name: Send Slack Alert
        if: ${{ secrets.SLACK_HA_WEBHOOK != '' }}
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "attachments": [
                {
                  "color": "danger",
                  "blocks": [
                    {
                      "type": "header",
                      "text": {
                        "type": "plain_text",
                        "text": "🚨 HA Alert: ${{ needs.health_check.outputs.status }}"
                      }
                    },
                    {
                      "type": "section",
                      "fields": [
                        {
                          "type": "mrkdwn",
                          "text": "*Status:*\n${{ needs.health_check.outputs.status }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Alerts:*\n${{ needs.health_check.outputs.alerts }} issues"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Action Required:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                        }
                      ]
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_HA_WEBHOOK }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Create GitHub Issue for Critical
        if: needs.health_check.outputs.status == 'critical'
        uses: actions/github-script@v7
        with:
          script: |
            // Check for existing open HA issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ha-alert,critical'
            });
            
            // Don't create duplicate issues
            if (issues.data.length > 0) {
              console.log('Existing HA critical issue found, skipping creation');
              return;
            }
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 HA CRITICAL: System health check failed`,
              body: `## High Availability Alert - CRITICAL
              
**Status:** ${{ needs.health_check.outputs.status }}
**Time:** ${new Date().toISOString()}
**Run:** [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})

### Immediate Actions Required:
1. Check the [workflow logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
2. SSH to server and run: \`php artisan ha:monitor\`
3. Check component-specific status
4. Initiate failover if needed: \`php artisan db:failover promote\`

### Monitoring Dashboard
Run locally: \`php artisan ha:monitor --daemon --alert\`

---
*This issue was automatically created by the HA monitoring workflow.*`,
              labels: ['ha-alert', 'critical', 'automated']
            });

  weekly_report:
    name: Weekly HA Report
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 0 * * 0'
    
    steps:
      - name: Generate Weekly Report
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/absensiQRPro/backend
            
            echo "=== Weekly HA Report ===" > /tmp/ha-weekly-report.txt
            echo "Generated: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> /tmp/ha-weekly-report.txt
            echo "" >> /tmp/ha-weekly-report.txt
            
            # Current status
            echo "## Current Status" >> /tmp/ha-weekly-report.txt
            php artisan ha:monitor >> /tmp/ha-weekly-report.txt
            
            # DB failover status
            echo "" >> /tmp/ha-weekly-report.txt
            echo "## Database Replication Status" >> /tmp/ha-weekly-report.txt
            php artisan db:failover status >> /tmp/ha-weekly-report.txt
            
            cat /tmp/ha-weekly-report.txt
