name: Secret Scan Protection

on:
  push:
    branches: [ main, develop, staging ]
  pull_request:
    branches: [ main, develop, staging ]

jobs:
  secret-scan:
    name: Scan for Secrets and Sensitive Data
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better detection
      
      - name: Check for .env file in repository
        run: |
          echo "🔍 Checking for .env files..."
          if find . -name ".env" -not -path "*/node_modules/*" -not -path "*/.git/*" | grep -q .; then
            echo "❌ ERROR: .env file found in repository!"
            echo "The following .env files were found:"
            find . -name ".env" -not -path "*/node_modules/*" -not -path "*/.git/*"
            echo ""
            echo "⚠️  .env files should NEVER be committed to version control"
            echo "Please remove them and add to .gitignore"
            exit 1
          fi
          echo "✅ No .env files found"
      
      - name: Scan for APP_KEY in commits
        run: |
          echo "🔍 Scanning for APP_KEY patterns..."
          if git log --all -p | grep -E "^\+.*APP_KEY=base64:[A-Za-z0-9+/]{40,}"; then
            echo "❌ ERROR: APP_KEY with actual value detected in commit history!"
            echo ""
            echo "⚠️  This is a critical security issue"
            echo "Please remove the commit containing the secret"
            exit 1
          fi
          echo "✅ No APP_KEY patterns found"
      
      - name: Scan for database passwords
        run: |
          echo "🔍 Scanning for database passwords..."
          if git log --all -p | grep -E "^\+.*DB_PASSWORD=[^'\"]*[a-zA-Z0-9]{8,}" | grep -v "your-secure-password"; then
            echo "❌ ERROR: Database password detected in commit history!"
            echo ""
            echo "⚠️  Database credentials should never be committed"
            exit 1
          fi
          echo "✅ No database passwords found"
      
      - name: Scan for QR secret keys
        run: |
          echo "🔍 Scanning for QR_SECRET_KEY..."
          if git log --all -p | grep -E "^\+.*QR_SECRET_KEY=[^'\"]*[a-zA-Z0-9]{16,}" | grep -v "your-secret-key-here"; then
            echo "❌ ERROR: QR_SECRET_KEY detected in commit history!"
            echo ""
            echo "⚠️  Secret keys should never be committed"
            exit 1
          fi
          echo "✅ No QR secret keys found"
      
      - name: Scan for private keys
        run: |
          echo "🔍 Scanning for private keys..."
          if git log --all -p | grep -E "^\+.*-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----"; then
            echo "❌ ERROR: Private key detected in commit history!"
            echo ""
            echo "⚠️  Private keys should NEVER be committed"
            exit 1
          fi
          echo "✅ No private keys found"
      
      - name: Scan for API tokens
        run: |
          echo "🔍 Scanning for API tokens..."
          if git log --all -p | grep -E "^\+.*(SANCTUM_TOKEN|API_TOKEN|BEARER_TOKEN)=[^'\"]*[a-zA-Z0-9]{20,}"; then
            echo "❌ ERROR: API token detected in commit history!"
            echo ""
            echo "⚠️  API tokens should never be committed"
            exit 1
          fi
          echo "✅ No API tokens found"

      - name: Scan for GitHub PATs
        run: |
          echo "🔍 Scanning for GitHub Personal Access Tokens..."
          if git log --all -p | grep -E "^\+.*ghp_[A-Za-z0-9]{36}"; then
            echo "❌ ERROR: GitHub PAT (ghp_) detected in commit history!"
            echo ""
            echo "⚠️  GitHub tokens should never be committed"
            echo "Please remove the commit containing the token"
            exit 1
          fi
          echo "✅ No GitHub PATs found"

      - name: Block committed token dump files
        run: |
          echo "🔍 Checking for forbidden token dump files..."
          if git ls-files | grep -E "(^|/)tokens\.json$"; then
            echo "❌ ERROR: token dump file is tracked by git"
            echo "Use tokens.local.json and keep it untracked"
            exit 1
          fi
          echo "✅ No forbidden token dump files tracked"
      
      - name: Scan for AWS credentials
        run: |
          echo "🔍 Scanning for AWS credentials..."
          if git log --all -p | grep -E "^\+.*(AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY)=[^'\"]*[A-Z0-9]{16,}"; then
            echo "❌ ERROR: AWS credentials detected in commit history!"
            echo ""
            echo "⚠️  AWS credentials should NEVER be committed"
            exit 1
          fi
          echo "✅ No AWS credentials found"
      
      - name: Check for certificate files
        run: |
          echo "🔍 Checking for certificate files..."
          if find . -type f \( -name "*.pem" -o -name "*.key" -o -name "*.p12" -o -name "*.pfx" \) \
             -not -path "*/node_modules/*" \
             -not -path "*/.git/*" \
             -not -path "*/vendor/*" | grep -q .; then
            echo "❌ ERROR: Certificate or key files found in repository!"
            echo "The following files were found:"
            find . -type f \( -name "*.pem" -o -name "*.key" -o -name "*.p12" -o -name "*.pfx" \) \
               -not -path "*/node_modules/*" \
               -not -path "*/.git/*" \
               -not -path "*/vendor/*"
            echo ""
            echo "⚠️  Certificate files should NEVER be committed"
            exit 1
          fi
          echo "✅ No certificate files found"
      
      - name: Scan current diff for secrets
        if: github.event_name == 'pull_request'
        run: |
          echo "🔍 Scanning PR diff for secrets..."
          
          # Get the diff for this PR
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          
          SECRETS_FOUND=0
          
          # Check for various secret patterns
          if grep -E "^\+.*APP_KEY=base64:" pr_diff.txt; then
            echo "❌ APP_KEY detected in PR"
            SECRETS_FOUND=1
          fi
          
          if grep -E "^\+.*DB_PASSWORD=" pr_diff.txt | grep -v "your-secure-password"; then
            echo "❌ DB_PASSWORD detected in PR"
            SECRETS_FOUND=1
          fi
          
          if grep -E "^\+.*QR_SECRET_KEY=" pr_diff.txt | grep -v "your-secret-key-here"; then
            echo "❌ QR_SECRET_KEY detected in PR"
            SECRETS_FOUND=1
          fi

          if grep -E "^\+.*\"token\"\\s*:\\s*\"[0-9]+\\|[A-Za-z0-9]{20,}" pr_diff.txt; then
            echo "❌ Sanctum-like token pattern detected in PR"
            SECRETS_FOUND=1
          fi
          
          if grep -E "^\+.*-----BEGIN.*PRIVATE KEY-----" pr_diff.txt; then
            echo "❌ Private key detected in PR"
            SECRETS_FOUND=1
          fi
          
          if [ $SECRETS_FOUND -eq 1 ]; then
            echo ""
            echo "❌ ERROR: Secrets detected in pull request!"
            echo "Please remove all secrets before merging"
            exit 1
          fi
          
          echo "✅ No secrets found in PR diff"
      
      - name: Security scan summary
        if: success()
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  ✅ Security Scan PASSED                                     ║"
          echo "║  No secrets or sensitive data detected                       ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
