[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
logfile_maxbytes=10MB
logfile_backups=5
loglevel=info

[program:php-fpm]
command=php-fpm
autostart=true
autorestart=true
startretries=3
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=3
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue-worker-default]
command=php artisan queue:work --sleep=3 --tries=3 --max-time=3600 --queue=default
directory=/var/www/html
autostart=true
autorestart=true
startretries=3
startsecs=10
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue-worker-high]
command=php artisan queue:work --sleep=3 --tries=3 --max-time=3600 --queue=high
directory=/var/www/html
autostart=true
autorestart=true
startretries=3
startsecs=10
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue-worker-notifications]
command=php artisan queue:work --sleep=3 --tries=3 --max-time=3600 --queue=notifications
directory=/var/www/html
autostart=true
autorestart=true
startretries=3
startsecs=10
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:horizon]
command=php artisan horizon
directory=/var/www/html
autostart=true
autorestart=true
startretries=3
startsecs=10
stopwaitsecs=3600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=/bin/sh -c "while [ true ]; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
directory=/var/www/html
autostart=true
autorestart=true
startretries=3
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[group:absensiqrpro-worker]
programs=queue-worker-default,queue-worker-high,queue-worker-notifications
priority=999
